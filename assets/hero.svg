<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="qianxunslimg profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#11182c"/>
      <stop offset="100%" stop-color="#15132b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="52%" r="36%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes catBlink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes pulseDot { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.35; } }
      .cursor { animation: blink 1.05s infinite; }
      .cat-eye { transform-box: fill-box; transform-origin: center; animation: catBlink 4.6s infinite; }
      .cat-float { animation: float 4.2s ease-in-out infinite; }
      .spark { animation: pulseDot 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.4"/>
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#glow1)"/>
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#glow2)"/>

  <!-- Subtle dot grid -->
  <g fill="#334155" fill-opacity="0.35">
    <circle cx="540" cy="56" r="1.2"/><circle cx="564" cy="56" r="1.2"/><circle cx="588" cy="56" r="1.2"/><circle cx="612" cy="56" r="1.2"/>
    <circle cx="540" cy="80" r="1.2"/><circle cx="564" cy="80" r="1.2"/><circle cx="588" cy="80" r="1.2"/><circle cx="612" cy="80" r="1.2"/>
    <circle cx="540" cy="104" r="1.2"/><circle cx="564" cy="104" r="1.2"/><circle cx="588" cy="104" r="1.2"/><circle cx="612" cy="104" r="1.2"/>
    <circle cx="540" cy="128" r="1.2"/><circle cx="564" cy="128" r="1.2"/><circle cx="588" cy="128" r="1.2"/><circle cx="612" cy="128" r="1.2"/>
    <circle cx="540" cy="152" r="1.2"/><circle cx="564" cy="152" r="1.2"/><circle cx="588" cy="152" r="1.2"/><circle cx="612" cy="152" r="1.2"/>
  </g>

  <!-- Terminal top bar -->
  <path d="M 1 17 Q 1 1 17 1 L 843 1 Q 859 1 859 17 L 859 36 L 1 36 Z" fill="#0d1326" fill-opacity="0.9"/>
  <line x1="1" y1="36" x2="859" y2="36" stroke="#1e293b" stroke-width="1"/>
  <circle cx="22" cy="18.5" r="5.5" fill="#fb7185"/>
  <circle cx="40" cy="18.5" r="5.5" fill="#fbbf24"/>
  <circle cx="58" cy="18.5" r="5.5" fill="#34d399"/>
  <text x="430" y="22.5" text-anchor="middle" fill="#64748b" font-size="12" class="mono">qianxunslimg@lab: ~/profile — zsh</text>

  <!-- Left terminal content -->
  <text x="32" y="68" fill="#34d399" font-size="13" class="mono">❯</text>
  <text x="48" y="68" fill="#94a3b8" font-size="13" class="mono">whoami --verbose</text>

  <text x="32" y="108" fill="url(#nameGrad)" font-size="34" font-weight="800" letter-spacing="-0.5" class="sans">qianxunslimg</text>
  <rect x="278" y="84" width="114" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="293" cy="96" r="4" fill="#34d399" class="spark"/>
  <text x="304" y="100" fill="#cbd5e1" font-size="11.5" font-weight="600" class="sans">Online · Lab</text>

  <text x="32" y="138" fill="#e2e8f0" font-size="14.5" font-weight="500" class="sans">自动驾驶从业者 · Autonomous Driving · AI &amp; Hardware Tinkerer</text>

  <text x="32" y="168" fill="#34d399" font-size="12.5" class="mono">❯</text>
  <text x="48" y="168" fill="#94a3b8" font-size="12.5" class="mono">echo $MOTTO</text>
  <text x="32" y="191" fill="#38bdf8" font-size="12.5" class="mono">"Autonomous driving by day, turning old phones into servers by night."</text>
  <rect x="566" y="179" width="8" height="15" rx="1.5" fill="#38bdf8" class="cursor"/>

  <!-- Right cute cyber-cat peeking mascot (nod to profile avatar) -->
  <g transform="translate(658, 52)">
    <g class="cat-float">
    <!-- Soft halo -->
    <circle cx="86" cy="74" r="64" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="86" cy="74" r="57" fill="#111b33" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Cat ears -->
    <path d="M 46 62 L 40 26 L 70 46 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 48 54 L 45 34 L 62 47 Z" fill="#f472b6" fill-opacity="0.55"/>
    <path d="M 126 62 L 132 26 L 102 46 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 124 54 L 127 34 L 110 47 Z" fill="#f472b6" fill-opacity="0.55"/>

    <!-- Cat head -->
    <ellipse cx="86" cy="78" rx="46" ry="38" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <!-- Tabby forehead stripes -->
    <path d="M 86 42 L 86 53 M 76 44 L 78 53 M 96 44 L 94 53" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (blinking!) -->
    <g class="cat-eye">
      <ellipse cx="68" cy="77" rx="6.5" ry="7.5" fill="#0f172a"/>
      <circle cx="65.5" cy="74.5" r="2.2" fill="#38bdf8"/>
      <ellipse cx="104" cy="77" rx="6.5" ry="7.5" fill="#0f172a"/>
      <circle cx="101.5" cy="74.5" r="2.2" fill="#38bdf8"/>
    </g>

    <!-- Blush -->
    <ellipse cx="55" cy="86" rx="6" ry="3.2" fill="#f472b6" fill-opacity="0.38"/>
    <ellipse cx="117" cy="86" rx="6" ry="3.2" fill="#f472b6" fill-opacity="0.38"/>

    <!-- Nose & mouth -->
    <path d="M 83 84 L 89 84 L 86 88 Z" fill="#f472b6"/>
    <path d="M 86 88 Q 81 94 76 91 M 86 88 Q 91 94 96 91" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#64748b" stroke-width="1.4" stroke-linecap="round">
      <line x1="34" y1="79" x2="49" y2="81"/>
      <line x1="33" y1="87" x2="49" y2="86"/>
      <line x1="138" y1="79" x2="123" y2="81"/>
      <line x1="139" y1="87" x2="123" y2="86"/>
    </g>

    <!-- Cute paws resting on terminal edge -->
    <ellipse cx="62" cy="115" rx="11" ry="7" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.8"/>
    <ellipse cx="110" cy="115" rx="11" ry="7" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.8"/>

    <!-- Floating code badge -->
    <g transform="translate(124, 10)">
      <rect x="0" y="0" width="38" height="20" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1"/>
      <text x="19" y="13.5" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700" class="mono">&lt;/&gt;</text>
    </g>
    </g>
  </g>
</svg>
